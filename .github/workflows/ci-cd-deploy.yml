name: Build & Deploy

on:
  push:
    branches: [main]

# The job reads the repo and nothing else. Registry and server access come from
# secrets, not from GITHUB_TOKEN.
permissions:
  contents: read

# Actions are pinned to commit SHAs, because a tag can be moved to point at other
# code. To bump one, resolve the new tag with
# `git ls-remote https://github.com/<owner>/<action> refs/tags/<tag>^{}`.

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Named so that "Required reviewers" can be set on it under Settings →
    # Environments. A push to main deploys to production, and that includes
    # nginx/admin, which the script below links into /etc/nginx and reloads.
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # ── Pre-build type check (fast-fail before the slower Docker build) ────
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      # ── Docker image build & push ─────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          target: runner
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_ONESIGNAL_APP_ID=${{ secrets.NEXT_PUBLIC_ONESIGNAL_APP_ID }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/erp-admin:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/erp-admin:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Deploy to VDS ────────────────────────────────────────────────────
      - name: Deploy to VDS
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          IMAGE_REPO: ${{ secrets.DOCKERHUB_USERNAME }}/erp-admin
          IMAGE_SHA: ${{ github.sha }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_SSH_KEY }}
          envs: IMAGE_REPO,IMAGE_SHA,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
          script: |
            set -euo pipefail

            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

            REPO_DIR=~/erp-admin
            COMPOSE_FILE=docker-compose.prod.yml
            DOMAIN=admin.uyer.app
            HEALTH_URL=https://$DOMAIN
            HEALTH_TIMEOUT_SECONDS=60
            APP_SERVICE=app

            if [ ! -d "$REPO_DIR" ]; then
              git clone ${{ secrets.VDS_REPO_URL }} "$REPO_DIR"
            fi
            cd "$REPO_DIR"
            git fetch origin main
            git reset --hard origin/main

            # ── 0. Sync nginx site config and reload ─────────────────────
            NGINX_ENABLED="/etc/nginx/sites-enabled/admin"
            if [ -f "$NGINX_ENABLED" ]; then
              sudo ln -sf ~/erp-admin/nginx/admin /etc/nginx/sites-enabled/admin
              nginx -t && systemctl reload nginx
            fi

            # ── 1. Capture currently-deployed image digest for rollback ────
            PREV_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' \
              "$IMAGE_REPO:latest" 2>/dev/null || echo "")
            echo "Previous digest: ${PREV_DIGEST:-<none>}"

            # ── 2. Pull new image + swap container ────────────────────────
            docker compose -f "$COMPOSE_FILE" pull "$APP_SERVICE"
            docker compose -f "$COMPOSE_FILE" up -d "$APP_SERVICE"

            # ── 3. Health probe ────────────────────────────────────────────
            echo "Waiting up to ${HEALTH_TIMEOUT_SECONDS}s for $HEALTH_URL ..."
            HEALTHY=0
            DEADLINE=$(( $(date +%s) + HEALTH_TIMEOUT_SECONDS ))
            while [ $(date +%s) -lt $DEADLINE ]; do
              if curl -fsS --max-time 3 "$HEALTH_URL" > /dev/null 2>&1; then
                HEALTHY=1
                echo "Healthy."
                break
              fi
              sleep 2
            done

            if [ $HEALTHY -eq 1 ]; then
              docker tag "$IMAGE_REPO:$IMAGE_SHA" "$IMAGE_REPO:previous" || true
              exit 0
            fi

            # ── 4. Rollback ────────────────────────────────────────────────
            echo "Health check failed after ${HEALTH_TIMEOUT_SECONDS}s — rolling back."
            docker compose -f "$COMPOSE_FILE" logs --tail=80 "$APP_SERVICE" || true

            if [ -z "$PREV_DIGEST" ]; then
              echo "No previous digest available (first-ever deploy?). Manual recovery needed."
              exit 1
            fi

            echo "Restoring $PREV_DIGEST"
            docker pull "$PREV_DIGEST"
            docker tag "$PREV_DIGEST" "$IMAGE_REPO:latest"
            docker compose -f "$COMPOSE_FILE" up -d "$APP_SERVICE"

            sleep 5
            if curl -fsS --max-time 5 "$HEALTH_URL" > /dev/null 2>&1; then
              echo "Rollback succeeded — running on previous image."
            else
              echo "Rollback container is also unhealthy. Manual intervention required."
            fi
            exit 1
